name: Full-history secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all branches and tags with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pinned Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Record refs and reachable commit count
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Git refs fetched ==="
          git for-each-ref --format='%(refname)' | sort
          echo "=== Reachable commits across all refs ==="
          git rev-list --all --count

      - name: Scan every commit reachable from every fetched ref
        id: scan
        shell: bash
        run: |
          set +e
          gitleaks git \
            --log-opts="--all" \
            --redact=100 \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks-full-history.sarif" \
            --exit-code=2 \
            --verbose \
            .
          result=$?
          set -e

          if [ "$result" -eq 0 ]; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "Full-history scan completed: no findings."
          elif [ "$result" -eq 2 ]; then
            echo "result=leaks" >> "$GITHUB_OUTPUT"
            echo "::warning::Gitleaks found potential secrets in reachable Git history. Values are redacted."
          else
            echo "result=error" >> "$GITHUB_OUTPUT"
            echo "::error::Gitleaks scanner failed with exit code $result."
            exit "$result"
          fi

      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-full-history-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks-full-history.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the check if findings exist
        if: steps.scan.outputs.result == 'leaks'
        shell: bash
        run: |
          echo "::error::Potential secrets were found in Git history. Review the redacted artifact and rotate any real credentials."
          exit 1
